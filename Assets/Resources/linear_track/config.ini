; LinearTrack Unity 配置文件（全部使用脚本内置默认值）
; 配置项来源：读取本文件的脚本
;   [serialSettings]  <- LinearTrackMoving.cs (Awake)
;   [trail_content]   <- Context_generate.cs / StartMenuDraw.cs
;   [context0]        <- Context_generate.cs (逐 context 读取)

; ---- 串口设置（LinearTrackMoving.cs）----
[serialSettings]
; 端口黑名单，逗号分隔，默认空
blackList=
; 优先尝试的推荐端口，逗号分隔，默认空
recommendPort=
; 握手版本白名单，逗号分隔，默认空（空=不校验版本；Due 固件版本为 LT1.0）
compatibleVersion=
; 波特率，仅接受 115200/230400/250000/460800/500000/921600，默认 115200
serialSpeed=115200

; ---- 试次内容（Context_generate.cs / StartMenuDraw.cs）----
[trail_content]
; 参与重复的 context 列表，逗号分隔，默认 context0
context_for_repeat=context0
; 重复次数，默认 5
repeat_num=5
; 起始模式，默认 0
start_mode=0

; ---- context 定义（Context_generate.cs 逐项读取）----
[context0]
; 起始位置，默认 0
start=0
; context 长度，默认 10
length=10
; 走廊墙纸材质，默认 point_sparse
wall_paper=point_sparse
; 奖励区墙纸材质，默认 bar
reward_zone_paper=bar
; 奖励区长度，默认 3
reward_zone_length=3
; 奖励区相对起点的偏移，默认 1
reward_zone_start=1
; 地标 prefab 名称，默认 none
landmark_name=none
; 地标起始位置，默认 -1
landmark_start=-1
; 单个 context 最大舔水计数，默认 8
lick_count_max=8
; 舔水阈值（before,after 或 low,high），默认 4,8
lick_threshold=4,8
; 结束时切换的材质（entry,exit），默认 grey,black
end_context=grey,black
; 结束参数，默认 3
end_arg=3
